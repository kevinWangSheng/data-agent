# Runs on every commit, for humans and coding agents alike (plan §6). Modeled on ktx.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # The sandbox denies writes to .claude/settings.json; this hook opens files read-write.
        exclude: ^\.claude/settings\.json$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files # keeps run trajectories and databases out of git
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
