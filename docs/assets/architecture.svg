<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">data-agent architecture</title>
  <desc id="desc">A task goes to the main agent. Three switchable layers sit above it: Skills, context tools and a verifier subagent. The agent reaches the database only through data tools and a read-only gateway, changes data only by editing the dbt project and running dbt, and writes one event log per run.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gTask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="gSkill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gContext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gVerifier" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gTools" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gGate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="gStore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gLog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e2e8f0"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>

  <!-- Switchable layers -->
  <rect x="290" y="36" width="560" height="176" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="64" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="1.5">SWITCHABLE LAYERS</text>
  <text x="830" y="64" fill="#94a3b8" font-size="13" text-anchor="end">each one is a flag in the run config</text>

  <g filter="url(#shadow)">
    <rect x="310" y="82" width="164" height="108" rx="14" fill="url(#gSkill)"/>
    <rect x="488" y="82" width="164" height="108" rx="14" fill="url(#gContext)"/>
    <rect x="666" y="82" width="164" height="108" rx="14" fill="url(#gVerifier)"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="392" y="120" font-size="19" font-weight="700">Skills</text>
    <text x="392" y="146" font-size="13" fill-opacity="0.92">SKILL.md workflows</text>
    <text x="392" y="165" font-size="13" fill-opacity="0.92">for dbt and SQL tasks</text>

    <text x="570" y="120" font-size="19" font-weight="700">Context tools</text>
    <text x="570" y="146" font-size="13" fill-opacity="0.92">discover · hydrate</text>
    <text x="570" y="165" font-size="13" fill-opacity="0.92">dictionary_search</text>

    <text x="748" y="120" font-size="19" font-weight="700">Verifier</text>
    <text x="748" y="146" font-size="13" fill-opacity="0.92">read-only subagent</text>
    <text x="748" y="165" font-size="13" fill-opacity="0.92">checks changed models</text>
  </g>

  <!-- Task -->
  <g filter="url(#shadow)">
    <rect x="44" y="286" width="170" height="68" rx="34" fill="url(#gTask)"/>
  </g>
  <text x="129" y="316" fill="#1f1300" font-size="19" font-weight="700" text-anchor="middle">Task</text>
  <text x="129" y="337" fill="#1f1300" font-size="13" text-anchor="middle">question or dbt job</text>

  <!-- Main agent -->
  <g filter="url(#shadow)">
    <rect x="390" y="270" width="360" height="100" rx="20" fill="url(#gAgent)"/>
  </g>
  <text x="570" y="314" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle">Main agent</text>
  <text x="570" y="342" fill="#ffffff" fill-opacity="0.92" font-size="14" text-anchor="middle">Claude Agent SDK · any Anthropic-compatible model</text>

  <!-- Data access -->
  <rect x="900" y="196" width="256" height="408" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#2dd4bf" stroke-width="2"/>
  <text x="920" y="224" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.5">DATA ACCESS</text>
  <text x="1136" y="224" fill="#94a3b8" font-size="13" text-anchor="end">every config</text>

  <g filter="url(#shadow)">
    <rect x="922" y="244" width="212" height="84" rx="14" fill="url(#gTools)"/>
    <rect x="922" y="366" width="212" height="84" rx="14" fill="url(#gGate)"/>
    <path d="M922 504 a106 16 0 0 1 212 0 v62 a106 16 0 0 1 -212 0 z" fill="url(#gStore)"/>
  </g>
  <path d="M922 504 a106 16 0 0 0 212 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="1028" y="280" font-size="19" font-weight="700">Data tools</text>
    <text x="1028" y="304" font-size="13" fill-opacity="0.92">MCP server over stdio</text>

    <text x="1028" y="402" font-size="19" font-weight="700">Read-only gateway</text>
    <text x="1028" y="426" font-size="13" fill-opacity="0.92">SQL parsed · writes blocked</text>

    <text x="1028" y="552" font-size="18" font-weight="700">DuckDB / Postgres</text>
  </g>

  <!-- dbt project -->
  <g filter="url(#shadow)">
    <rect x="600" y="484" width="200" height="84" rx="14" fill="url(#gStore)"/>
  </g>
  <text x="700" y="520" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">dbt project</text>
  <text x="700" y="544" fill="#ffffff" fill-opacity="0.92" font-size="13" text-anchor="middle">the only write path</text>

  <!-- Event log and outputs -->
  <g filter="url(#shadow)">
    <rect x="330" y="484" width="200" height="84" rx="14" fill="url(#gLog)"/>
    <rect x="44" y="484" width="220" height="84" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  </g>
  <text x="430" y="520" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Event log</text>
  <text x="430" y="544" fill="#ffffff" fill-opacity="0.92" font-size="13" text-anchor="middle">one JSONL file per run</text>
  <text x="154" y="520" fill="#fbcfe8" font-size="17" font-weight="700" text-anchor="middle">Scores · costs</text>
  <text x="154" y="544" fill="#fbcfe8" font-size="13" text-anchor="middle">leaderboard trajectories</text>

  <!-- Arrows -->
  <g fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M214 320 H384"/>
    <path d="M750 300 C820 300 850 286 916 286"/>
    <path d="M1028 328 V360"/>
    <path d="M1028 450 V482"/>
    <path d="M660 370 C660 420 690 440 696 478"/>
    <path d="M800 526 H916"/>
    <path d="M480 370 C480 420 440 440 434 478"/>
    <path d="M330 526 H270"/>
  </g>
  <g fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <path d="M392 190 C392 230 470 236 480 264"/>
    <path d="M570 270 V196"/>
    <path d="M660 270 C670 236 748 230 748 196"/>
  </g>

  <!-- Arrow labels -->
  <g fill="#cbd5e1" font-size="13">
    <text x="372" y="244" text-anchor="end">loaded into the prompt</text>
    <text x="580" y="240">calls</text>
    <text x="764" y="244">dispatches</text>
    <text x="826" y="276" text-anchor="middle">queries</text>
    <text x="712" y="430">edits files, runs dbt</text>
    <text x="858" y="516" text-anchor="middle">materializes</text>
    <text x="428" y="430" text-anchor="end">records every step</text>
  </g>
</svg>
