# LiveSQLBench Base-Lite (Query tasks) — data-agent (evals/harbor_agent.py), ticket 128
#
# The tasks are generated by `python -m evals livesqlbench tasks` (on the server, by
# `da-remote benchmarks`); run from the repo root (PYTHONPATH=. puts evals/ on the import path) with
# the DATA_AGENT_* variables set and the verifiers' write credential in the host environment
# (`da-remote start` sources it for a LiveSQLBench run). The tasks name it as a Harbor template
# under `[verifier] env`, resolved when verifying; this config never sets it, and never passes it
# with --ae, which Harbor puts into the agent's container (.scratch/livesqlbench/spec.md U6).
#
#   PYTHONPATH=. uv run harbor run --config evals/configs/livesqlbench.data-agent.yaml \
#     --path <generated tasks> -i lsb-<instance_id>
#
# `evals ablate --benchmark livesqlbench` runs this config.

name: livesqlbench

n_attempts: 3
n_concurrent_trials: 3
quiet: true

# As data-eng-bench's job config: retry the model API's transient errors only
# (evals.harbor_agent.TRANSIENT_ERRORS); Harbor's default exclusions apply.
retry:
  max_retries: 3
  include_exceptions:
    - ApiRateLimitError
    - ApiInternalServerError
    - ApiOverloadedError
    - ApiConnectionClosedError
    - ApiResponseStalledError

environment:
  type: docker         # the task's compose: the local main image and its database image

agents:
  - import_path: evals.harbor_agent:DataAgent
    model_name: deepseek/deepseek-flash
    kwargs:
      run_config: full
      # A query run on the task's Postgres through the read-only role (evals.harbor_agent).
      benchmark: livesqlbench
      # The tasks' agent limit (upstream adapter.py: 1800 s); the agent stops itself before it.
      agent_timeout_sec: 1800
    # No --network: data-agent loads web search and fetch only with it, which the adapter never
    # passes (ADR-0010). Its sandbox_exec runs in the task container itself (`--sandbox local`).
