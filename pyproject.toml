[project]
name = "data-agent"
version = "0.0.0"
description = "Open-source, self-hostable data agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.31",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: calls a real model or external service; skipped unless -m integration",
]
addopts = "-m 'not integration'"
