[project]
name = "data-agent"
version = "0.0.0"
description = "Open-source, self-hostable data agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.168",
    "duckdb==1.2.2",
    "mcp>=2.2,<3",
    "sqlglot==30.8.0",
]

[project.scripts]
data-agent = "data_agent.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31",
  # dbt for local dbt runs and seam A, pinned like the data-eng-bench image (plan §5). Not a runtime
  # dependency: an installed agent uses the environment's dbt (Harbor: the image's).
  "dbt-core>=1.10,<1.11",
  "dbt-duckdb==1.10.0",
  "harbor==0.24.0",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]

# Skills live at the repo root (AGENTS.md); an installed agent finds them inside its package.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "data_agent/skills"

# Writes the source commit into the wheel (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py312"
# Copied from SignalPilot (NOTICE; modifications noted per file); keep upstream's style so diffs
# against it stay clean.
extend-exclude = ["src/data_agent/engine", "tests/engine", "skills/dbt-workflow/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
include = ["src", "tests", "evals"]
# SignalPilot copies (see [tool.ruff]); their annotations predate sqlglot 30's stubs.
exclude = ["src/data_agent/engine", "tests/engine"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: calls a real model or external service; skipped unless -m integration",
]
addopts = "-m 'not integration'"

[tool.uv]
# harbor (dev, the Harbor adapter's base class) asks for pathspec>=1.0.3, dbt-core 1.10 for <0.13.
# harbor uses pathspec only to publish datasets (harbor/publisher/packager.py), which we never do.
override-dependencies = ["pathspec>=0.9,<0.13"]
