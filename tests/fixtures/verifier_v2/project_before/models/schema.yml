version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
      - name: status
      - name: amount
      - name: order_date
  - name: daily_sales
    description: One row per store per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, sale_date]
    columns:
      - name: store_id
      - name: sale_date
      - name: revenue
      - name: running_revenue
